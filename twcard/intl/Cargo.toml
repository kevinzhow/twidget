[package]
name = "twcard_icu4x"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
[dependencies.icu]
git = "https://github.com/unicode-org/icu4x.git"
rev = "38a49da495248dd1ded84cf306e4ca42e64d5bb3"
features = ["experimental"]

[dependencies.icu_provider]
git = "https://github.com/unicode-org/icu4x.git"
rev = "38a49da495248dd1ded84cf306e4ca42e64d5bb3"

[dependencies.fixed_decimal]
git = "https://github.com/unicode-org/icu4x.git"
rev = "38a49da495248dd1ded84cf306e4ca42e64d5bb3"
features = ["ryu"]

[dependencies.writeable]
git = "https://github.com/unicode-org/icu4x.git"
rev = "38a49da495248dd1ded84cf306e4ca42e64d5bb3"

[profile.release]
panic = "abort"
strip = "debuginfo"
